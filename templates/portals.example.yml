# Configuración del Escáner de Portales (Argentina)
#
# Estrategia (4 niveles):
#   0. Parser local → por empresa `parser:` para páginas SSR/estáticas (zero-token)
#   1. Playwright → careers_url de cada empresa (tiempo real, confiable)
#   2. HTTP JSON (WebFetch) → por empresa `api:` en tracked_companies
#   3. WebSearch con filtros site: (descubrimiento amplio, puede estar desactualizado)
#
# CÓMO PERSONALIZAR:
#   1. Copiá este archivo a portals.yml en la raíz del proyecto
#   2. Editá title_filter.positive con TUS keywords de roles objetivo
#   3. Agregá o quitá empresas en tracked_companies
#   4. Ajustá search_queries para tus portales preferidos
#   5. Poné enabled: false en empresas que no te interesen

# -- Filtro de ubicación --
# Filtra ofertas escaneadas por ubicación. Se aplica DESPUÉS del filtro de título,
# ANTES del dedup. Si este bloque está ausente, todas las ubicaciones pasan.

location_filter:
  always_allow:
    - "Argentina"
    - "Buenos Aires"
    - "CABA"
    - "Capital Federal"
    - "GBA"
    - "Córdoba"
    - "Rosario"
    - "Mendoza"
    - "La Plata"
  allow:
    - "Remoto"
    - "Remote"
    - "Argentina"
    - "Buenos Aires"
    - "CABA"
    - "Capital Federal"
    - "GBA"
    - "Gran Buenos Aires"
    - "Córdoba"
    - "Rosario"
    - "Mendoza"
    - "La Plata"
    - "Híbrido"
    - "Hybrid"
    - "Latinoamérica"
    - "Latam"
    - "LATAM"
    - "South America"
    - "América Latina"
    - "Cualquier lugar"
    - "Anywhere"
  block:
    - "Estados Unidos"
    - "United States"
    - "USA"
    - "España"
    - "Spain"
    - "Madrid"
    - "Barcelona"
    - "Uruguay"
    - "Montevideo"
    - "Chile"
    - "Santiago"
    - "Colombia"
    - "Bogotá"
    - "Medellín"
    - "México"
    - "Mexico"
    - "Ciudad de México"
    - "CDMX"
    - "Brasil"
    - "Brazil"
    - "São Paulo"
    - "India"
    - "Bengaluru"
    - "Reino Unido"
    - "United Kingdom"
    - "London"
    - "Germany"
    - "Alemania"
    - "Berlin"
    - "Francia"
    - "France"
    - "Paris"

# -- Filtro de título --
title_filter:
  positive:
    # [PERSONALIZAR] Agregá keywords que coincidan con TUS roles objetivo
    
    # -- Desarrollo Backend --
    - "Backend"
    - "Back-end"
    - "API"
    - "Microservicios"
    - "Microservices"
    - "Node.js"
    - "Python"
    - "Go"
    - "Golang"
    - "Java"
    - "Rust"
    - "GraphQL"
    - "REST"
    - "Arquitectura"
    - "Architect"
    
    # -- Desarrollo Frontend --
    - "Frontend"
    - "Front-end"
    - "React"
    - "Next.js"
    - "Angular"
    - "Vue"
    - "TypeScript"
    - "JavaScript"
    - "UI"
    - "UX"
    - "Full Stack"
    - "Full-Stack"
    - "Fullstack"
    
    # -- Data / ML / IA --
    - "Data Engineer"
    - "Data Engineering"
    - "Datos"
    - "Machine Learning"
    - "ML"
    - "IA"
    - "AI"
    - "LLM"
    - "GenAI"
    - "Data Science"
    - "Analytics"
    - "ETL"
    
    # -- DevOps / SRE / Infra --
    - "DevOps"
    - "SRE"
    - "Site Reliability"
    - "Cloud"
    - "AWS"
    - "GCP"
    - "Azure"
    - "Infraestructura"
    - "Infrastructure"
    - "Kubernetes"
    - "Docker"
    - "CI/CD"
    - "Platform Engineer"
    
    # -- Producto --
    - "Product Manager"
    - "Product Owner"
    - "PO"
    - "Technical PM"
    - "Technical Product"
    
    # -- Liderazgo --
    - "Tech Lead"
    - "Technical Lead"
    - "Team Lead"
    - "Engineering Manager"
    - "Staff Engineer"
    - "Principal Engineer"
    - "Arquitecto"
    - "CTO"
    - "VP of Engineering"
    
  negative:
    # [PERSONALIZAR] Roles que querés excluir
    - "Junior"
    - "Jr."
    - "Trainee"
    - "Intern"
    - "Pasante"
    - "Pasantía"
    - "Soporte Técnico"
    - "Help Desk"
    - "QA Manual"
    - "Tester Manual"
    - "Diseñador Gráfico"
    - "Community Manager"
    - "CM"
    - "Data Entry"
    - "Carga de Datos"
    - "Ventas"
    - "Sales"
    - "Call Center"
    - "Telemarketing"
    - "Cobranzas"
    - "Administrativo"
    - "Atención al Cliente"
    - "Cajero"
    - "Repositor"
    - "Cadete"
    - "Chofer"
    
  seniority_boost:
    - "Senior"
    - "Sr."
    - "Semi Senior"
    - "SSr."
    - "Staff"
    - "Principal"
    - "Lead"
    - "Líder"
    - "Head"
    - "Director"
    - "Gerente"
    - "Manager"

# -- Queries de búsqueda --
# Cada query dispara un WebSearch. Usar site: para filtrar por portal.

search_queries:
  # -- LinkedIn Argentina --
  - name: LinkedIn AR — Backend
    query: 'site:linkedin.com/jobs "Backend" OR "Back-end" OR "API" OR "Microservicios" Argentina OR Buenos Aires OR remoto'
    enabled: true

  - name: LinkedIn AR — Frontend
    query: 'site:linkedin.com/jobs "Frontend" OR "Front-end" OR "React" OR "Next.js" OR "TypeScript" Argentina OR Buenos Aires OR remoto'
    enabled: true

  - name: LinkedIn AR — Full Stack
    query: 'site:linkedin.com/jobs "Full Stack" OR "Full-Stack" OR "Fullstack" Argentina OR Buenos Aires OR remoto'
    enabled: true

  - name: LinkedIn AR — DevOps/Cloud
    query: 'site:linkedin.com/jobs "DevOps" OR "Cloud" OR "AWS" OR "GCP" OR "Kubernetes" OR "SRE" Argentina OR remoto'
    enabled: true

  - name: LinkedIn AR — Data/IA/ML
    query: 'site:linkedin.com/jobs "Data Engineer" OR "Machine Learning" OR "IA" OR "AI" OR "Data Science" Argentina OR remoto'
    enabled: true

  - name: LinkedIn AR — Tech Lead
    query: 'site:linkedin.com/jobs "Tech Lead" OR "Technical Lead" OR "Engineering Manager" OR "Staff Engineer" Argentina OR Buenos Aires'
    enabled: true

  - name: LinkedIn AR — Contractor/Remoto
    query: 'site:linkedin.com/jobs remoto OR contractor "desarrollador" OR "developer" OR "engineer" LATAM OR Argentina'
    enabled: true

  # -- ZonaJobs --
  - name: ZonaJobs — Desarrollo
    query: 'site:zonajobs.com.ar "desarrollador" OR "developer" OR "programador" OR "backend" OR "frontend" OR "full stack"'
    enabled: true

  - name: ZonaJobs — Sistemas/Infra
    query: 'site:zonajobs.com.ar "devops" OR "cloud" OR "infraestructura" OR "sistemas" OR "AWS" OR "kubernetes"'
    enabled: true

  - name: ZonaJobs — Datos/IA
    query: 'site:zonajobs.com.ar "datos" OR "data" OR "inteligencia artificial" OR "machine learning" OR "analytics"'
    enabled: true

  # -- Bumeran --
  - name: Bumeran — Desarrollo
    query: 'site:bumeran.com.ar "desarrollador" OR "developer" OR "programador" OR "backend" OR "frontend" OR "full stack"'
    enabled: true

  - name: Bumeran — Sistemas
    query: 'site:bumeran.com.ar "devops" OR "cloud" OR "infraestructura" OR "sistemas" OR "soporte IT"'
    enabled: true

  - name: Bumeran — Tecnología General
    query: 'site:bumeran.com.ar "tecnología" OR "informática" OR "sistemas" senior OR semi senior OR lead'
    enabled: true

  # -- Computrabajo --
  - name: Computrabajo — Desarrollo
    query: 'site:computrabajo.com.ar "desarrollador" OR "developer" OR "programador" OR "backend" OR "frontend" OR "full stack"'
    enabled: true

  - name: Computrabajo — Sistemas/Redes
    query: 'site:computrabajo.com.ar "devops" OR "sistemas" OR "redes" OR "infraestructura" OR "cloud"'
    enabled: true

  - name: Computrabajo — Datos
    query: 'site:computrabajo.com.ar "datos" OR "data" OR "BI" OR "analytics" OR "business intelligence"'
    enabled: true

  # -- Indeed Argentina --
  - name: Indeed AR — Tech General
    query: 'site:ar.indeed.com "software engineer" OR "desarrollador" OR "backend" OR "frontend" OR "full stack" remoto OR Buenos Aires OR Córdoba'
    enabled: true

  - name: Indeed AR — Senior/Lead
    query: 'site:ar.indeed.com "senior" OR "lead" OR "staff" "engineer" OR "desarrollador" remoto OR Argentina'
    enabled: true

  # -- GetOnBoard (Startups LATAM) --
  - name: GetOnBoard — Tech LATAM
    query: 'site:getonbrd.com "developer" OR "engineer" OR "desarrollador" remoto OR LATAM OR Argentina'
    enabled: true

  # -- Greenhouse (empresas internacionales con presencia en AR) --
  - name: Greenhouse — Remote LATAM
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "LATAM" OR "Argentina" OR "Latin America" OR "Remote South America"'
    enabled: true

  - name: Greenhouse — Tech General LATAM
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Software Engineer" OR "Backend Engineer" OR "Frontend Engineer" remote LATAM OR "South America"'
    enabled: true

  # -- Lever (empresas internacionales) --
  - name: Lever — Remote LATAM
    query: 'site:jobs.lever.co "LATAM" OR "Latin America" OR "Argentina" OR "Remote South America"'
    enabled: true

  # -- Ashby (empresas internacionales) --
  - name: Ashby — Remote LATAM
    query: 'site:jobs.ashbyhq.com "LATAM" OR "Latin America" OR "Argentina" OR "Remote South America"'
    enabled: true

  # -- Workana (Freelance LATAM) --
  - name: Workana — Desarrollo
    query: 'site:workana.com "desarrollador" OR "developer" OR "backend" OR "frontend"'
    enabled: true

  # -- Upwork / Freelancer (contractor USD) --
  - name: Upwork — Desarrollo LATAM
    query: 'site:upwork.com "developer" OR "engineer" LATAM OR "Latin America"'
    enabled: true

  # -- WeWorkRemotely / RemoteOK (contractor USD) --
  - name: Remote LATAM Boards
    query: 'site:weworkremotely.com OR site:remoteok.com "LATAM" OR "Latin America" OR "anywhere" "developer" OR "engineer"'
    enabled: true

