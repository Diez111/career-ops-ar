# Career-Ops — Configuración de Perfil (Argentina)
# Copiá este archivo a config/profile.yml y completalo con tus datos.
# Esta es la fuente de verdad única para tus datos personales en todos los modos.

candidate:
  full_name: "Juan Pérez"
  email: "juan@ejemplo.com.ar"
  phone: "+54 11 5555-0123"
  location: "Buenos Aires, CABA, Argentina"
  linkedin: "linkedin.com/in/juanperez"
  portfolio_url: "https://juanperez.com.ar"
  github: "github.com/juanperez"
  twitter: "https://x.com/juanperez"

target_roles:
  # Tus roles North Star — para lo que estás optimizando
  primary:
    - "Desarrollador Backend Senior"
    - "Tech Lead"
  # Arquetipos que ayudan al sistema de evaluación a puntuar fit
  archetypes:
    - name: "Desarrollador Backend"
      level: "Senior"
      fit: "primary"        # primary = rol soñado, secondary = buen fit, adjacent = estirable
    - name: "DevOps / SRE"
      level: "Semi-Senior"
      fit: "secondary"
    - name: "Liderazgo Técnico"
      level: "Lead"
      fit: "secondary"
    - name: "Producto Técnico"
      level: "Semi-Senior"
      fit: "adjacent"

narrative:
  # Tu titular profesional (1 línea)
  headline: "Desarrollador Backend que arma sistemas escalables"
  # Tu historia de salida — qué te hace único
  exit_story: "5 años armando APIs y microservicios en producción para fintech y e-commerce."
  # Tus top 3-5 superpoderes
  superpowers:
    - "APIs REST y GraphQL de alto rendimiento"
    - "Arquitectura de microservicios en AWS"
    - "Prototipado rápido con métricas de impacto"
  # Proof points — proyectos, artículos, casos de estudio con impacto medible
  proof_points:
    - name: "API de Procesamiento de Pagos"
      url: "https://juanperez.com.ar/proyectos/api-pagos"
      hero_metric: "Reducción de latencia p95 de 2.1s a 380ms"
    - name: "Herramienta Open Source"
      url: "https://github.com/juanperez/tool"
      hero_metric: "500+ estrellas GitHub"

compensation:
  target_range: "$2.500.000-4.000.000 ARS"     # Tu compensación total objetivo (bruto mensual)
  target_range_usd: "$4.000-6.500 USD"           # Tu compensación objetivo contractor (mensual USD)
  currency: "ARS"
  minimum_ars: "$1.800.000 ARS"                  # Número de retirada para relación de dependencia
  minimum_usd: "$3.000 USD"                      # Número de retirada para contractor
  location_flexibility: "Remoto preferido. Híbrido CABA 2-3 días aceptable."
  # Tipos de contratación que aceptás
  contract_types:
    - "relacion_dependencia"    # En blanco, con aportes, aguinaldo, obra social
    - "monotributo"             # Facturación como autónomo
    - "contractor_usd"          # Pago en dólares, empresa del exterior

location:
  country: "Argentina"
  city: "Buenos Aires"
  province: "CABA"
  timezone: "GMT-3 (ART)"
  visa_status: "Ciudadano argentino"
  relocation: "No"
  # Para roles remotos fuera de Argentina:
  remote_availability: "Full remoto. Solapamiento horario con USA/UE negociable."

language:
  # Idioma de los modos
  modes_dir: "modes/es"            # Usar modos en español argentino
  cv_output_language: "es"         # Idioma del CV generado
  jd_fallback_language: "es"       # Idioma por defecto si no se detecta

cv:
  output_format: "html"            # "html" (default) o "latex"
  # (Opcional) ID de diseño de CV en Canva para generación visual vía /career-ops pdf.
  # canva_resume_design_id: "DAxxxxxxxxx"

# Umbral de auto-generación de PDF durante evaluación
# Una oferta genera su CV PDF automáticamente solo cuando su puntaje
# es >= a este umbral. Generar un PDF tarda ~30-60s por oferta y la
# mayoría de las ofertas en un scan puntúan 2.x/3.x y nunca llegan
# a postulación real — así que el filtro evita renders al pedo.
#
# Default (clave ausente o comentada): 3.0
# Subilo (ej. 4.0) para auto-generar PDFs solo para matches fuertes.
# Ponelo en 0 para generar PDF para todas las ofertas.
# auto_pdf_score_threshold: 4.0

# Notificaciones y automatización
notifications:
  scan_reminder_days: 3           # Recordarme escanear portales cada N días
  followup_check_days: 2          # Recordarme revisar seguimientos cada N días

# Preferencias de búsqueda
search_preferences:
  # Tipos de empresa preferidos
  company_types:
    - "producto"                  # Empresa de producto (propio o SaaS)
    - "startup_crecida"           # Startup serie A/B+
    - "consultora"                # Consultora/Software factory
  # Tamaños de empresa preferidos
  company_sizes:
    - "50-200"                    # Scale-up
    - "200-1000"                  # Empresa mediana
  # Industrias de interés
  industries:
    - "fintech"
    - "e-commerce"
    - "logistica"
    - "salud"
  # Lo que NO querés
  deal_breakers:
    - "Presencial 5 días full-time"
    - "Guardias rotativas 24/7 sin compensación"
    - "Stack legacy sin plan de modernización (ej: COBOL, VB6, jQuery sin framework)"
